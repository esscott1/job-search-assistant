name: job-search CI

on:
  # The drift tests (core/tests/test_rubric.py, test_canonical_url.py) read the plugin's score.py,
  # canonical_url.py and gold tables; the comparison tests (evals/comparison/) read its fixtures
  # and the scoring cases' tags.
  pull_request:
    paths:
      - "orchestration/job-search/**"
      - ".github/workflows/job-search-*.yml"
      - "skills/job-search-assistant/job-fit-rubric/score.py"
      - "skills/job-search-assistant/job-tracker/canonical_url.py"
      - "skills/job-search-assistant/evals/fixtures/**"
      - "skills/job-search-assistant/evals/tier2-*/prompt.md"
  push:
    branches: [main]
    paths:
      - "orchestration/job-search/**"
      - "skills/job-search-assistant/job-fit-rubric/score.py"
      - "skills/job-search-assistant/job-tracker/canonical_url.py"
      - "skills/job-search-assistant/evals/fixtures/**"
      - "skills/job-search-assistant/evals/tier2-*/prompt.md"

permissions:
  contents: read

defaults:
  run:
    working-directory: orchestration/job-search

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --all-packages --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Unit + graph tests (fakes only — no keys, no network)
        run: uv run pytest -q
      - name: Eval harness smoke test
        run: uv run python evals/job-fit/run_evals.py --fake
