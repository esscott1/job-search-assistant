[project]
name = "job-search-langgraph"
version = "0.1.0"
description = "LangGraph orchestration of the job-search workflow (state graphs, checkpoints, interrupts)."
requires-python = ">=3.11"
dependencies = [
    "job-search-core[anthropic,google]",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0",
    "python-dotenv>=1.0",
]

[project.scripts]
jobs = "job_search_langgraph.cli:main"

[tool.uv.sources]
job-search-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_search_langgraph"]
