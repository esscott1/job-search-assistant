[project]
name = "job-search-workspace"
version = "0.1.0"
description = "Workspace root for the job-search orchestration: one framework-free core, one package per orchestration approach."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "approaches/*"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter owns line length; long strings and diagrams are fine

[tool.pytest.ini_options]
testpaths = ["core/tests", "approaches"]
